<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Other things! · Tim 'mithro' Ansell</title>
  <meta name="description" content="Talk by Tim 'mithro' Ansell — LCA 2014 · 10 Jan 2014.">
  <meta name="git-commit" content="489d8f1330fbdb3de2131150d47f3735c3f59e78">
  <link rel="canonical" href="https://preview.mith.ro/pr-2/talks/lca14-other/">
  <style>:root {
  --bg: #0e0f11;
  --panel: #16171a;
  --panel2: #1c1d21;
  --line: #2c2d31;
  --gold: #d4a72c;
  --gold-dim: #8a6d1f;
  --silk: #e8e6df;
  --muted: #9a948a;
  --blue: #5a74e8;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--silk);
  font-family: var(--mono);
  line-height: 1.55;
}

main { display: block; }

a { color: var(--gold); }

.topline {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: .5rem;
  max-width: 1080px; margin: 0 auto;
  padding: .9rem 1.25rem;
  border-bottom: 1px solid var(--gold-dim);
  font-size: .8rem; letter-spacing: .1em; text-transform: uppercase;
}
.topline .brand {
  color: var(--gold); font-weight: 700; text-decoration: none;
}
.topline .brand::before { content: "⌖ "; color: var(--silk); }
.topline nav { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; }
@media (max-width: 480px) {
  .topline { padding: .9rem .8rem; }
  .topline nav { gap: .4rem .9rem; font-size: .72rem; }
}
.topline nav a { color: var(--muted); text-decoration: none; }
.topline nav a.on { color: var(--silk); border-bottom: 2px solid var(--gold); padding-bottom: .1rem; }
.topline nav a:hover, .topline nav a:focus-visible { color: var(--gold); }

.hero {
  display: grid; grid-template-columns: 1.15fr 1fr;
  max-width: 1080px; margin: 0 auto;
  border-bottom: 1px solid var(--line);
}
.hero-text { padding: 2.4rem 1.25rem; align-self: center; }
.hero-text h1 {
  font-size: 2.5rem; line-height: 1.08; margin: 0 0 .9rem;
  letter-spacing: -.01em; font-weight: 700; text-wrap: balance;
}
.hero-text h1 .nick { color: var(--gold); }
.hero-text .bio {
  margin: 0 0 1.4rem; color: #c4beb2; font-size: .95rem;
  font-family: var(--sans);
}
.hero-photo { position: relative; min-height: 340px; border-left: 1px solid var(--gold-dim); }
.hero-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.hero-photo .cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: rgba(14,15,17,.82);
  border-top: 1px solid var(--gold-dim);
  font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
  padding: .45rem .9rem; margin: 0;
}

.contact { list-style: none; margin: 0; padding: 0; font-size: .82rem; }
.contact .ci-icon svg { width: .95em; height: .95em; fill: currentColor; vertical-align: -0.1em; }
.contact .ci-emoji { font-size: .9em; }
.flag-tel { position: relative; display: inline-block; line-height: 1; }
.flag-tel-badge {
  position: absolute; right: -.4em; bottom: -.25em;
  display: inline-flex; align-items: center; justify-content: center;
  width: .95em; height: .95em;
  background: var(--bg); border: 1px solid var(--line); border-radius: 50%;
}
.flag-tel-badge svg { width: .6em; height: .6em; fill: currentColor; }
/* Two independent columns read top-to-bottom: contact + professional
   profiles down the first, social + writing down the second. A wrapped
   entry only pushes its own column, never the neighbouring rows. */
.hero-contact { columns: 13rem 2; column-gap: 1.2rem; }
.hero-contact li { break-inside: avoid; margin-bottom: .3rem; }
.hero-contact a { color: var(--silk); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.hero-contact a:hover, .hero-contact a:focus-visible { color: var(--gold); }
.contact-inline { display: flex; flex-wrap: wrap; gap: .3rem 1.4rem; }
.contact-inline a { color: var(--muted); text-decoration: none; }
.contact-inline a:hover, .contact-inline a:focus-visible { color: var(--gold); }
.contact-icons { gap: .5rem 1.5rem; align-items: center; }
.contact-icons .ci-icon svg { width: 1.25rem; height: 1.25rem; }
.contact-icons .ci-emoji { font-size: 1.2rem; }

.spec {
  display: grid; grid-template-columns: repeat(6, 1fr);
  max-width: 1080px; margin: 0 auto;
  border-bottom: 1px solid var(--line);
}
.spec > div { padding: 1rem 1.25rem; border-right: 1px solid var(--line); }
.spec > div:last-child { border-right: 0; }
.spec dt { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 .2rem; }
.spec dd { margin: 0; font-size: 1.5rem; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }

.sect { max-width: 1080px; margin: 0 auto; padding: 1.8rem 1.25rem 0; }
.sect h2 {
  font-size: .8rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--gold); margin: 0 0 .9rem;
}
.sect .more { font-size: .8rem; }

.visually-hidden { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.nowrap { white-space: nowrap; }

.talks-table { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: .85rem; }
.talks-table th { font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: left; font-weight: 600; padding: 0 .8rem .3rem 0; border-bottom: 1px solid var(--gold-dim); }
.talks-table th:last-child { text-align: right; padding-right: 0; }
.talks-table td { border-top: 1px solid var(--line); padding: .55rem .8rem .55rem 0; vertical-align: top; }
.talks-table td.yr { color: var(--muted); white-space: nowrap; width: 4.5rem; font-variant-numeric: tabular-nums; }
.talks-table td.ti a { color: var(--silk); text-decoration: underline; text-decoration-color: var(--gold-dim); text-underline-offset: 3px; padding: .3rem 0; }
.talks-table td.ti a:hover, .talks-table td.ti a:focus-visible { color: var(--gold); text-decoration-color: var(--gold); }
.talks-table td.ev { color: var(--muted); text-align: right; }
.talks-table td.ev > span { display: block; max-width: 28rem; margin-left: auto; text-wrap: pretty; }
.talks-table .vid, .talks-table td.ti a.vid { color: var(--blue); font-size: .78rem; text-decoration: none; white-space: nowrap; display: inline-block; padding: .4rem .3rem; }
.embeds { display: flex; flex-wrap: wrap; gap: .6rem .8rem; margin: .15rem 0 .3rem; }
/* Pull the embed block up under its talk: drop the title row's bottom
   padding when an embed row follows, so caption+tile read as one group. */
.talks-table tr:has(+ tr.embrow) td { padding-bottom: .1rem; }
.embed-col { display: flex; flex-direction: column; gap: .3rem; flex: 1 1 300px; max-width: 420px; min-width: 0; }
.emb-cap { font-size: .75rem; color: var(--muted); text-decoration: none; align-self: flex-start; padding: .15rem 0; }
.emb-cap:hover, .emb-cap:focus-visible { color: var(--gold); }
.emb-cap .ci-icon svg { width: .95em; height: .95em; fill: currentColor; vertical-align: -0.1em; }
.embeds iframe { display: block; width: 100%; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.embeds .emb-video { aspect-ratio: 16 / 9; }
.embeds .emb-slides { aspect-ratio: 960 / 569; }
.embed-lite {
  position: relative; display: block; width: 100%; padding: 0; cursor: pointer;
  border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  background: var(--panel); color: var(--silk);
}
.embed-lite.lite-video { aspect-ratio: 16 / 9; }
.embed-lite.lite-slides { aspect-ratio: 960 / 569; }
.embed-lite img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
}
/* Play overlays carry the embed's brand: YouTube's red button on
   videos, a Slides-yellow slide on presentations. */
.embed-lite .lite-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 3.4rem; display: block;
  filter: drop-shadow(0 1px 6px rgba(0, 0, 0, .55));
  transition: transform .12s ease;
}
.embed-lite .lite-play svg { display: block; width: 100%; height: auto; }
.embed-lite:hover .lite-play, .embed-lite:focus-visible .lite-play {
  transform: translate(-50%, -50%) scale(1.1);
}
/* ---- Film strips ----------------------------------------------------
   One frame per slide, scrolled sideways. The wrapper (a block inside
   the table cell — table rows ignore content-visibility) is skipped
   entirely until it nears the viewport. */
.strip-wrap { flex: 1 1 320px; min-width: 0; contain: inline-size; content-visibility: auto; contain-intrinsic-size: auto 150px; }
.strip { display: flex; gap: .35rem; overflow-x: auto; scroll-snap-type: x proximity; padding: .2rem 0 .5rem; scrollbar-width: thin; scrollbar-color: var(--gold-dim) transparent; }
.strip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.strip .frame { flex: 0 0 auto; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--panel); line-height: 0; }
.strip .frame:hover, .strip .frame:focus-visible { border-color: var(--gold); }
.strip img { display: block; height: 135px; width: auto; }
.strip .frame.more { display: flex; align-items: center; justify-content: center; height: 135px; line-height: 1.3; color: var(--gold); font-size: .8rem; text-decoration: none; background: var(--panel2); }
.strip-lg .strip img { height: 200px; }
.strip-lg { contain-intrinsic-size: auto 220px; }
@media (prefers-reduced-motion: no-preference) {
  .strip .frame { transition: transform .12s ease, border-color .12s ease; }
  .strip .frame:hover { transform: translateY(-2px); }
}
@media (max-width: 640px) {
  .strip img, .strip .frame.more { height: 110px; }
  .strip-lg .strip img { height: 150px; }
}
.talks-table td.ev a { color: inherit; text-decoration: underline; text-decoration-color: var(--gold-dim); text-underline-offset: 3px; padding: .3rem 0; }
.talks-table td.ev a:hover, .talks-table td.ev a:focus-visible { color: var(--gold); text-decoration-color: var(--gold); }
.table-scroll { overflow-x: auto; }

.gallery {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: .9rem;
  max-width: 1080px; margin: 0 auto; padding: 1.8rem 1.25rem 2.2rem;
}
.shot { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; aspect-ratio: 4 / 3; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot figcaption {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: rgba(14,15,17,.82);
  font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
  padding: .3rem .6rem; text-wrap: pretty;
}

.footer {
  border-top: 1px solid var(--gold-dim);
  margin-top: 2.5rem;
}
.footer .contact-inline {
  max-width: 1080px; margin: 0 auto; padding: 1rem 1.25rem 1.4rem;
  font-size: .72rem; letter-spacing: .04em;
}

.skills-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 2.5rem; }
.skills-grid li { text-wrap: pretty; }

.prose { font-family: var(--sans); font-size: .95rem; color: #c4beb2; }
.prose a { text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.prose a:hover, .prose a:focus-visible { border-bottom-color: var(--gold); }
.sect .prose + .prose { border-top: 1px solid var(--line); margin-top: 1.2rem; padding-top: 1.2rem; }
.prose h2 { font-family: var(--mono); color: var(--gold); font-size: .95rem; letter-spacing: .1em; text-transform: uppercase; margin: 2rem 0 .6rem; }
.prose h3 { font-family: var(--mono); color: var(--silk); font-size: .9rem; margin: 1.4rem 0 .4rem; }
.prose.meta, .prose .meta { color: var(--muted); font-family: var(--mono); font-size: .78rem; }

/* Project entries: name/years/role in a left column, blurb filling the
   rest of the row — same full-width tabular feel as the talks table. */
.proj { display: grid; grid-template-columns: minmax(15rem, 22rem) 1fr; gap: .3rem 2rem; align-items: start; padding: 1rem 0; border-top: 1px solid var(--line); }
.sect h2 + .proj, .sect .prose + .proj { border-top: 0; }
.proj h3 { margin: 0; font-family: var(--mono); color: var(--silk); font-size: .9rem; }
.proj a { color: var(--silk); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.proj a:hover, .proj a:focus-visible { color: var(--gold); border-bottom-color: var(--gold); }
.proj .meta { margin: .35rem 0 0; color: var(--muted); font-family: var(--mono); font-size: .78rem; }
.proj-blurb { margin: 0; font-family: var(--sans); font-size: .95rem; color: #c4beb2; }
.proj-blurb p { margin: 0 0 .6rem; }
.proj-blurb p:last-child { margin-bottom: 0; }
/* No bullets — the stacked degree lines already read as a list. */
ul.deg-list { padding-left: 0; list-style: none; }
.deg-list li + li { margin-top: .3rem; }

.papers-list { list-style: none; margin: 0; padding: 0; }
.papers-list li:first-child { border-top: 0; }
.papers-list li { border-top: 1px solid var(--line); padding: .8rem 0; }
.papers-list .ti a { color: var(--silk); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.papers-list .ti a:hover, .papers-list .ti a:focus-visible { color: var(--gold); }
.papers-list .au { display: block; color: var(--muted); font-size: .8rem; font-family: var(--sans); }
.papers-list .ve { display: block; color: var(--muted); font-size: .78rem; }
.papers-list .ci { color: var(--gold); font-size: .78rem; }
.papers-list .pdf, .talks-table .pdf { color: var(--gold); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; font-size: .82rem; }
.papers-list .pdf:hover, .papers-list .pdf:focus-visible,
.talks-table .pdf:hover, .talks-table .pdf:focus-visible { color: var(--silk); }
.talks-table .au { display: block; color: var(--muted); font-size: .8rem; font-family: var(--sans); }
.talks-table .ci { color: var(--gold); font-size: .82rem; }

.err {
  max-width: 1080px; margin: 0 auto; padding: 4rem 1.25rem; text-align: center;
  min-height: calc(100vh - 22rem);
  display: flex; flex-direction: column; justify-content: center;
}
.err h1 { color: var(--gold); font-size: 2rem; }
.err .prose { margin: 0 auto; }

/* Below this width the two-column talk table can't fit, so instead of
   horizontal scrolling each row stacks: title, then event · date. */
@media (max-width: 640px) {
  .talks-table { min-width: 0; }
  .talks-table thead { display: none; }
  .talks-table, .talks-table tbody, .talks-table tr, .talks-table td { display: block; }
  .talks-table tr { border-top: 1px solid var(--line); padding: .55rem 0; }
  .talks-table tr.embrow { border-top: 0; padding-top: 0; }
  .talks-table td { border-top: 0; padding: 0; }
  .talks-table tr:has(+ tr.embrow) { padding-bottom: .1rem; }
  .talks-table tr:has(+ tr.embrow) td { padding-bottom: 0; }
  .talks-table td.ev { text-align: left; }
  .talks-table td.ev > span { max-width: none; margin-left: 0; font-size: .78rem; margin-top: .15rem; }
  /* Stacked title/event links: let their tap padding take up layout
     space so the two targets stop overlapping (WCAG 2.5.8). */
  .talks-table td.ti > a, .talks-table td.ev a { display: inline-block; }
  .talks-table td.ev .ev-none { display: none; }
  .proj { display: block; }
  .proj-blurb { margin-top: .4rem; }
}

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  /* Photo first on phones: above the name, below the site header. */
  .hero-photo { order: -1; border-left: 0; border-bottom: 1px solid var(--gold-dim); min-height: 300px; }
  /* Stat counters: two rows of three on phones. */
  .spec { grid-template-columns: repeat(3, 1fr); }
  .spec > div { padding: .7rem .6rem; }
  .spec > div:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
  .spec > div:nth-child(3) { border-right: 0; }
  .spec dt { font-size: .58rem; letter-spacing: .1em; }
  .spec dd { font-size: 1.15rem; }
  .gallery { grid-template-columns: 1fr; }
  .hero-contact { columns: 1; }
  .skills-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: no-preference) {
  a { transition: color .12s ease; }
}

.year-head { font-family: var(--mono); color: var(--silk); font-size: 1rem; margin: 1.6rem 0 .4rem; }
.ev-none { opacity: .35; }
/* The embeds sit in their own full-width row attached to the talk above. */
.talks-table tr.embrow td { border-top: 0; padding-top: 0; }

/* ---- Print ----------------------------------------------------------
   The resume page prints like the canonical resume Google Doc: black
   Arial on white, plain section headings, name + contact masthead.
   The masthead exists only in resume/index.html; the rest of these
   rules also give the other pages a sane light printout. */
/* ---- Talks section pages -------------------------------------------- */
.subnav { display: flex; flex-wrap: wrap; gap: .3rem 1.3rem; font-size: .8rem; margin: -.4rem 0 1.2rem; }
.subnav a { color: var(--muted); text-decoration: none; padding: .2rem 0; }
.subnav a.on { color: var(--silk); border-bottom: 2px solid var(--gold); }
.subnav a:hover, .subnav a:focus-visible { color: var(--gold); }
.talk-page h2 { margin-bottom: .3rem; }
.talk-meta { color: var(--muted); font-size: .82rem; margin: .2rem 0 .8rem; }
.talk-meta a { color: var(--silk); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1rem; }
.chip { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold-dim); border-radius: 999px; padding: .15rem .6rem; text-decoration: none; }
.chip:hover, .chip:focus-visible { border-color: var(--gold); }
.prevnext { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; }
.year-head .count { color: var(--muted); font-weight: 400; font-size: .8rem; margin-left: .4rem; }
.cat-blurb { margin: 0 0 .6rem; }
.hl { border-top: 1px solid var(--line); padding: 1.2rem 0; }
.hl h3 { margin: 0 0 .2rem; font-family: var(--mono); font-size: 1rem; }
.hl h3 a { color: var(--silk); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.hl h3 a:hover, .hl h3 a:focus-visible { color: var(--gold); }
.hl .prose { margin: 0 0 .6rem; }

/* ---- Talks hub ------------------------------------------------------ */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin: .2rem 0 1.6rem; }
.card { display: block; border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.1rem; background: var(--panel); color: var(--silk); text-decoration: none; }
.card strong { display: block; color: var(--gold); margin-bottom: .25rem; }
.card span { font-family: var(--sans); font-size: .9rem; color: var(--muted); }
.card:hover, .card:focus-visible { border-color: var(--gold); }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; align-items: end; margin: .6rem 0 1.6rem; }
.bar-col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.bar-col .n { font-size: .65rem; color: var(--muted); line-height: 1; height: .8rem; }
.bar-col .b { width: 100%; height: calc(130px * var(--h) / 100); min-height: 2px; background: var(--gold); border-radius: 2px 2px 0 0; }
.bar-col .y { font-size: .58rem; color: var(--muted); margin-top: .35rem; writing-mode: vertical-rl; transform: rotate(180deg); }
.stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 2rem; }
.stat-list { list-style: none; margin: 0; padding: 0; font-size: .85rem; }
.stat-list li { display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--line); padding: .35rem 0; }
.stat-list .num { color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-list a { color: var(--silk); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.stat-list a:hover, .stat-list a:focus-visible { color: var(--gold); }
@media (max-width: 760px) {
  .cards, .stats-grid { grid-template-columns: 1fr; }
  .bar-col .b { height: calc(90px * var(--h) / 100); }
}

.print-head { display: none; }

@page { margin: 1.6cm; }

@media print {
  body {
    background: #fff; color: #000;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10.5pt; line-height: 1.35;
  }
  .topline, .footer, .no-print { display: none !important; }
  a { color: #000; }

  .print-head {
    display: block; text-align: center;
    border-bottom: 2pt solid #000;
    margin: 0 0 10pt; padding-bottom: 6pt;
  }
  .print-head h1 { font-size: 20pt; margin: 0 0 3pt; }
  .print-head .print-contact { margin: 0; font-size: 10pt; }

  .sect { max-width: none; padding: 0; }
  .sect h2 {
    color: #000; font-size: 13pt; letter-spacing: .02em;
    border-bottom: 1.5pt solid #000; padding-bottom: 2pt;
    margin: 14pt 0 6pt;
  }
  .sect h2 [aria-hidden="true"] { display: none; } /* emoji: screen-only */

  .prose { color: #000; font-family: inherit; font-size: 10.5pt; break-inside: avoid; }
  .prose h3 { color: #000; font-family: inherit; font-size: 11pt; margin: 8pt 0 2pt; }
